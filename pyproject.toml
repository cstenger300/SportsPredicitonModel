[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-prediction-model"
version = "0.1.0"
description = "Pregame NFL features and chronological Ridge/Poisson evaluation"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "pyarrow>=18,<24", "scikit-learn>=1.6,<2", "requests>=2.32,<3", "numpy>=1.26,<3", "joblib>=1.4,<2", "scipy>=1.10,<2", "streamlit>=1.40,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
nfl-model = "nfl_model.cli:main"
nfl-compare = "nfl_model.comparison:main"
nfl-predict = "nfl_model.prediction:main"
nfl-calibrate = "nfl_model.research:main"
nfl-backtest = "nfl_model.backtest:main"
nfl-update = "nfl_model.workflow:main"
nfl-odds = "nfl_model.odds_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
